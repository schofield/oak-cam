# Dispatch-only. Runs the device tests (#[ignore]) and a short live capture on
# the owner's self-hosted box with the OAK-D Pro plugged in. Never runs on
# hosted runners or on push: those have no OAK device.
#
# The box registers with labels "self-hosted" + "linux" (or "windows")
# depending on the OS it is booted into; see scripts/ci/setup-*-runner.*:
#   gh workflow run hardware.yml -f os=linux
#   gh workflow run hardware.yml -f os=windows
name: Hardware

on:
  workflow_dispatch:
    inputs:
      os:
        description: Self-hosted OS to run on (matches the runner's second label)
        type: choice
        options:
          - linux
          - windows
        default: linux
      headless_seconds:
        description: Length of the --headless --no-vcam --stats capture
        default: "20"

concurrency:
  group: hardware
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  hardware:
    timeout-minutes: 90
    # Targets the owner's machine: the "os" input is the runner's second label.
    runs-on: [self-hosted, "${{ inputs.os }}"]
    defaults:
      run:
        shell: bash
    steps:
      # Keep the self-hosted workspace between runs: the default clean removes
      # ignored files, which throws away target/ every run.
      - uses: actions/checkout@v4
        with:
          clean: false

      # A self-hosted Windows runner resolves `bash` to the WSL launcher in
      # System32 (hosted runners put Git's bin first); every `shell: bash`
      # step needs Git Bash, so prepend it.
      - name: Prefer Git Bash over WSL for bash steps (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = (Get-Command git.exe).Source
          $bin = Join-Path (Split-Path (Split-Path $git -Parent) -Parent) "bin"
          if (-not (Test-Path (Join-Path $bin "bash.exe"))) { throw "Git Bash not found under $bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      # ---- depthai-core (same install and stamp as self-hosted-ci.yml) --------
      - name: depthai-core (Linux)
        if: runner.os == 'Linux'
        run: |
          root="${OAK_DEPTHAI_ROOT:-$HOME/.cache/oak-cam/depthai}"
          want="$(git rev-parse HEAD:scripts/depthai)"
          stamp="$root/current/.oak-scripts-tree"
          if [ -f "$root/current/oak-flags.json" ] && [ "$(cat "$stamp" 2>/dev/null)" = "$want" ]; then
            echo "depthai-core install at $(readlink -f "$root/current") is current"
          else
            scripts/depthai/build.sh
            echo "$want" > "$stamp"
          fi

      - name: depthai-core (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $root = if ($env:OAK_DEPTHAI_ROOT) { $env:OAK_DEPTHAI_ROOT } else { Join-Path $env:LOCALAPPDATA "oak-cam\depthai" }
          $want = (& git rev-parse HEAD:scripts/depthai).Trim()
          $stamp = Join-Path $root "current\.oak-scripts-tree"
          $flags = Join-Path $root "current\oak-flags.json"
          if ((Test-Path $flags) -and (Test-Path $stamp) -and ((Get-Content -Raw $stamp).Trim() -eq $want)) {
            Write-Host "depthai-core install at $root\current is current"
          } else {
            .\scripts\depthai\fetch-windows.ps1
            Set-Content -Path $stamp -Value $want -Encoding ASCII
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $root "current\bin")

      # ---- device tests --------------------------------------------------------
      - name: Device tests (cargo test -- --ignored)
        run: cargo test --workspace --no-fail-fast -- --ignored --test-threads=1

      - name: Build oak-cam (release)
        run: cargo build --release --locked -p oak-cam

      - name: oak-cam --list and --probe
        run: |
          mkdir -p hw-out
          target/release/oak-cam --version | tee hw-out/version.txt
          target/release/oak-cam --list | tee hw-out/list.txt
          target/release/oak-cam --list --json > hw-out/list.json
          target/release/oak-cam --probe | tee hw-out/probe.txt

      # --duration stops oak-cam cleanly (it prints "stopped" and exits 0)
      # without a signal, which Git Bash on Windows cannot deliver to a
      # native process.
      - name: Live capture (--headless --no-vcam --stats)
        env:
          SECONDS_TO_RUN: ${{ inputs.headless_seconds }}
        run: |
          rc=0
          target/release/oak-cam --headless --no-vcam --stats --duration "$SECONDS_TO_RUN" \
            > hw-out/headless-stats.txt 2>&1 || rc=$?
          cat hw-out/headless-stats.txt
          if [ "$rc" -ne 0 ]; then
            echo "oak-cam --headless exited with $rc" >&2; exit "$rc"
          fi
          lines=$(grep -c "fps" hw-out/headless-stats.txt || true)
          echo "stats lines: $lines"
          [ "$lines" -ge 5 ] || { echo "expected at least 5 stats lines" >&2; exit 1; }

      - name: Virtual camera devices (Linux)
        if: runner.os == 'Linux'
        run: |
          if command -v v4l2-ctl >/dev/null 2>&1; then
            v4l2-ctl --list-devices 2>&1 | tee hw-out/v4l2-devices.txt || true
          else
            echo "v4l2-ctl missing (apt install v4l-utils)" | tee hw-out/v4l2-devices.txt
          fi

      - name: Virtual camera status (Windows)
        if: runner.os == 'Windows'
        run: target/release/oak-cam vcam status 2>&1 | tee hw-out/vcam-status.txt

      - name: Upload capture output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-${{ inputs.os }}-${{ github.run_id }}
          path: hw-out/
          if-no-files-found: warn
          retention-days: 30
